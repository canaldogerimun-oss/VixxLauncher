name: Build VixxLauncher APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar configuracao
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH

          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager nao encontrado"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses || true

          "$SDKMANAGER" --install \
            "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "platforms;android-36" \
            "build-tools;35.0.0" \
            "build-tools;36.0.0" \
            "ndk;27.2.12479018" \
            "cmake;3.22.1"

      - name: Baixar projeto do Google Drive
        run: |
          python -m pip install gdown
          gdown "1jVra-Mb8iFw8gOlhFeIFqdid2lbmbqw2" -O VixxLauncher.zip

      - name: Extrair projeto
        run: |
          mkdir project
          unzip -q VixxLauncher.zip -d project

      - name: Compilar APK
        run: |
          WRAPPER=$(find project -name gradlew -type f | head -n 1)

          if [ -z "$WRAPPER" ]; then
            echo "Gradle Wrapper nao encontrado"
            exit 1
          fi

          cd "$(dirname "$WRAPPER")"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: VixxLauncher-APK
          path: project/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          
